services:
  # HTTP API and the two gRPC services form one local application stack.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bank-backend:local
    restart: unless-stopped
    environment:
      APP_ENV: docker
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      GRPC_REPOSITORY_URL: repository-service:50052
      GRPC_EXCHANGE_RATE_URL: exchange-rate-service:50053
      CARD_BIN: ${CARD_BIN:-537541}
      KAFKA_BROKERS: kafka:9092
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      kafka:
        condition: service_healthy
      repository-service:
        condition: service_started
      exchange-rate-service:
        condition: service_healthy

  repository-service:
    build:
      context: ../Bank-repository-service
      dockerfile: Dockerfile
    image: bank-repository-service:local
    restart: unless-stopped
    environment:
      APP_ENV: local
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: 50052
      NETWORK: tcp
      SHUTDOWN_TIMEOUT: 10s
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-bank}
      DB_SSL_MODE: disable
      DB_MAX_OPEN_CONNS: 25
      DB_MAX_IDLE_CONNS: 5
      DB_CONN_MAX_LIFETIME: 30m
      DB_CONN_MAX_IDLE_TIME: 5m
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      REDIS_POOL_SIZE: 10
      REDIS_MIN_IDLE: 2
      KAFKA_ENABLED: "false"
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: bank-repository-service
      KAFKA_CONSUMER_GROUP: bank-repository-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 15s

  exchange-rate-service:
    build:
      # The directory currently has "exhange" (without the second "c") in its name.
      context: ../Bank-exhange-rate-service
      dockerfile: Dockerfile
    image: ${EXCHANGE_RATE_IMAGE:-bank-exchange-rate-service:local}
    init: true
    restart: unless-stopped
    environment:
      GRPC_PORT: 50053
      GRPC_NETWORK: tcp
      MONOBANK_BASE_URL: ${MONOBANK_BASE_URL:-https://api.monobank.ua}
      MONOBANK_CURRENCY_ENDPOINT: ${MONOBANK_CURRENCY_ENDPOINT:-/bank/currency}
      KAFKA_BROKERS: kafka:9092
    healthcheck:
      test: ["CMD", "/app/bank-exchange-rate-service", "healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      kafka:
        condition: service_healthy
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-bank}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-node KRaft broker intended for local development only.
  kafka:
    image: apache/kafka:4.0.0
    hostname: kafka
    extra_hosts:
      - "kafka:127.0.0.1"
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  kafka-data:
  postgres-data:
  redis-data:
