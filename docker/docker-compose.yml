name: bank-backend

services:
  app:
    container_name: bank-backend
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    image: bank-backend:local
    restart: unless-stopped
    environment:
      APP_ENV: docker
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      GRPC_REPOSITORY_URL: repository-service:50052
      GRPC_EXCHANGE_RATE_URL: exchange-rate-service:50053
      CARD_BIN: ${CARD_BIN:-537541}
      KAFKA_BROKERS: localhost:9092
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${KAFKA_HOST_PORT:-29092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    depends_on:
      repository-service:
        condition: service_started
      exchange-rate-service:
        condition: service_healthy

  repository-service:
    build:
      context: ../../Bank-repository-service
      dockerfile: Dockerfile
    image: bank-repository-service:local
    restart: unless-stopped
    environment:
      APP_ENV: local
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: 50052
      NETWORK: tcp
      SHUTDOWN_TIMEOUT: 10s
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-bank}
      DB_SSL_MODE: disable
      DB_MAX_OPEN_CONNS: 25
      DB_MAX_IDLE_CONNS: 5
      DB_CONN_MAX_LIFETIME: 30m
      DB_CONN_MAX_IDLE_TIME: 5m
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      REDIS_POOL_SIZE: 10
      REDIS_MIN_IDLE: 2
      KAFKA_ENABLED: "false"
      KAFKA_BROKERS: app:9092
      KAFKA_CLIENT_ID: bank-repository-service
      KAFKA_CONSUMER_GROUP: bank-repository-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 15s

  exchange-rate-service:
    build:
      context: ../../Bank-exhange-rate-service
      dockerfile: Dockerfile
    image: ${EXCHANGE_RATE_IMAGE:-bank-exchange-rate-service:local}
    init: true
    restart: unless-stopped
    environment:
      GRPC_PORT: 50053
      GRPC_NETWORK: tcp
      MONOBANK_BASE_URL: ${MONOBANK_BASE_URL:-https://api.monobank.ua}
      MONOBANK_CURRENCY_ENDPOINT: ${MONOBANK_CURRENCY_ENDPOINT:-/bank/currency}
      KAFKA_BROKERS: app:9092
    healthcheck:
      test: ["CMD", "/app/bank-exchange-rate-service", "healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-bank}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kafka-data:
  postgres-data:
  redis-data:
