apiVersion: v1
kind: ConfigMap
metadata:
  name: bank-backend-config
  namespace: bank
  labels:
    app.kubernetes.io/name: bank-backend
    app.kubernetes.io/part-of: bank
data:
  APP_ENV: kubernetes
  START_KAFKA: "false"
  HTTP_HOST: 0.0.0.0
  HTTP_PORT: "8080"
  GRPC_REPOSITORY_URL: bank-repository:50052
  GRPC_EXCHANGE_RATE_URL: exchange-rate-service:55053
  KAFKA_BROKERS: kafka-0.kafka-headless.bank.svc.cluster.local:9092,kafka-1.kafka-headless.bank.svc.cluster.local:9092,kafka-2.kafka-headless.bank.svc.cluster.local:9092
  KAFKA_ENABLED: "true"
  KAFKA_CLIENT_ID: bank-backend
  KAFKA_AUDIT_TOPIC: bank.backend.audit.v1
  KAFKA_TOPIC_PARTITIONS: "3"
  KAFKA_TOPIC_REPLICATION_FACTOR: "3"
  CARD_BIN: "444444"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bank-kafka-startup
  namespace: bank
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: bank
data:
  start.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    ordinal="${HOSTNAME##*-}"
    node_id="$((ordinal + 1))"
    config=/tmp/server.properties

    cat > "${config}" <<EOF
    process.roles=broker,controller
    node.id=${node_id}
    controller.quorum.voters=1@kafka-0.kafka-headless.bank.svc.cluster.local:9093,2@kafka-1.kafka-headless.bank.svc.cluster.local:9093,3@kafka-2.kafka-headless.bank.svc.cluster.local:9093
    controller.listener.names=CONTROLLER
    listeners=INTERNAL://:9092,CONTROLLER://:9093
    advertised.listeners=INTERNAL://${HOSTNAME}.kafka-headless.bank.svc.cluster.local:9092
    listener.security.protocol.map=INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
    inter.broker.listener.name=INTERNAL
    log.dirs=/var/lib/kafka/data
    num.partitions=3
    default.replication.factor=3
    min.insync.replicas=2
    offsets.topic.replication.factor=3
    transaction.state.log.replication.factor=3
    transaction.state.log.min.isr=2
    auto.create.topics.enable=false
    group.initial.rebalance.delay.ms=0
    EOF

    if [[ ! -f /var/lib/kafka/data/meta.properties ]]; then
      /opt/kafka/bin/kafka-storage.sh format --cluster-id MkU3OEVBNTcwNTJENDM2Qk --config "${config}"
    fi

    exec /opt/kafka/bin/kafka-server-start.sh "${config}"
