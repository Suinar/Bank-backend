apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: bank
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: bank
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: broker
      port: 9092
    - name: controller
      port: 9093
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: bank
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: bank
spec:
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: broker
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka
  namespace: bank
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: bank
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: bank
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: bank
spec:
  serviceName: kafka-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: bank
    spec:
      serviceAccountName: kafka
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka
          image: apache/kafka:4.0.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/opt/bank-kafka/start.sh"]
          ports:
            - name: broker
              containerPort: 9092
            - name: controller
              containerPort: 9093
          startupProbe:
            tcpSocket:
              port: broker
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: broker
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: broker
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
            - name: startup
              mountPath: /opt/bank-kafka
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: startup
          configMap:
            name: bank-kafka-startup
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: kafka
          app.kubernetes.io/part-of: bank
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
