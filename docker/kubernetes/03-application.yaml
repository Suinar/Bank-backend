apiVersion: v1
kind: ServiceAccount
metadata:
  name: bank-backend
  namespace: bank
  labels:
    app.kubernetes.io/name: bank-backend
    app.kubernetes.io/part-of: bank
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-backend
  namespace: bank
  labels:
    app.kubernetes.io/name: bank-backend
    app.kubernetes.io/part-of: bank
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bank-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bank-backend
        app.kubernetes.io/part-of: bank
    spec:
      serviceAccountName: bank-backend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bank-backend
          image: bank-backend:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: bank-backend-config
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bank-backend
  namespace: bank
  labels:
    app.kubernetes.io/name: bank-backend
    app.kubernetes.io/part-of: bank
spec:
  selector:
    app.kubernetes.io/name: bank-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
