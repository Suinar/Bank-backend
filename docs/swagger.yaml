      user_id:
        type: integer
    type: object
  core.CardCreateInput:
    properties:
      account_id:
        type: integer
      user_id:
        type: integer
    type: object
  core.CardStatus:
    enum:
    - 0
    - 1
    - 2
    - 3
    type: integer
    x-enum-varnames:
    - CardStatusClosed
    - CardStatusActive
    - CardStatusBlocked
    - StatusExpired
  core.Credit:
    properties:
      amount:
        type: integer
      currency_id:
        type: integer
      id:
        type: integer
      interest_rate:
        type: number
      monthly_payment:
        type: integer
      status:
        $ref: '#/definitions/core.CreditStatus'
      term_months:
        type: integer
      user_id:
        type: integer
    type: object
  core.CreditCreateInput:
    properties:
      amount:
        type: integer
      currency_id:
        type: integer
      term_months:
        type: integer
      user_id:
        type: integer
    type: object
  core.CreditStatus:
    enum:
    - 0
    - 1
    - 2
    type: integer
    x-enum-varnames:
    - CreditStatusClosed
    - CreditStatusActive
    - CreditStatusRejected
  core.Currency:
    properties:
      id:
