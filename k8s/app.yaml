# Runtime configuration is kept separate from the immutable application image.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bank-backend-config
  namespace: bank
data:
  APP_ENV: kubernetes
  HTTP_HOST: 0.0.0.0
  HTTP_PORT: "8080"
  GRPC_REPOSITORY_URL: bank-repository:50052
  GRPC_EXCHANGE_RATE_URL: bank-exchange-rate:50053
  CARD_BIN: "537541"
  KAFKA_BROKERS: kafka:9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-backend
  namespace: bank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bank-backend
  template:
    metadata:
      labels:
        app: bank-backend
    spec:
      containers:
        - name: bank-backend
          image: bank-backend:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: bank-backend-config
          ports:
            - name: http
              containerPort: 8080
          # The same lightweight endpoint is safe for readiness and liveness checks.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bank-backend
  namespace: bank
spec:
  selector:
    app: bank-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
